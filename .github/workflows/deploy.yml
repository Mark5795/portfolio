name: Build & Deploy Portfolio

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mark5795/portfolio

jobs:
  # STAP 1: Bouw de multi-architecture image op GitHub-hosted runners
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU (voor multi-arch ondersteuning)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in op GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # STAP 2: Deploy naar de K3s-cluster via een self-hosted runner
  deploy:
    needs: build
    runs-on: [self-hosted, linux, k3s]
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create namespace and registry secret
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          kubectl apply -f k8s/portfolio.yaml
          kubectl -n portfolio create secret docker-registry ghcr-pull-secret \
            --docker-server="${REGISTRY}" \
            --docker-username="${GHCR_USERNAME}" \
            --docker-password="${GHCR_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync application secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          kubectl -n portfolio create secret generic portfolio-secrets \
            --from-literal="postgres-password=${POSTGRES_PASSWORD}" \
            --from-literal="admin-password=${ADMIN_PASSWORD}" \
            --from-literal="turnstile-secret=${TURNSTILE_SECRET}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/portfolio.yaml

      - name: Roll out the new image
        run: |
          kubectl -n portfolio set image deployment/portfolio \
            portfolio=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}
          kubectl -n portfolio rollout status statefulset/postgres --timeout=5m
          kubectl -n portfolio rollout status deployment/portfolio --timeout=5m
