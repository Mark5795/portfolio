name: Build & Deploy Portfolio

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mark5795/portfolio

jobs:
  # STAP 1: Bouw de ARM64 image op de snelle GitHub Runners
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU (voor multi-arch ondersteuning)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in op GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # STAP 2: Laat de Raspberry Pi alleen de kant-en-klare image pullen en herstarten
  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Pull nieuwste image & herstart container
        run: |
          docker pull ghcr.io/mark5795/portfolio:latest
          docker stop mark-portfolio || true
          docker rm mark-portfolio || true
          docker compose up -d --build --remove-orphans