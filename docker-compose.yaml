services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PORTFOLIO_IMAGE:-mark-portfolio:latest}
    container_name: mark-portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TURNSTILE_SECRET: ${TURNSTILE_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - portfolio-data:/app/data

volumes:
  portfolio-data:
